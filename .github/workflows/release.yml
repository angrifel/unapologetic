name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

env:
  TAG: ${{ github.ref_name }}

jobs:
  draft-release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set archive name
        run: |
          export ASSET_PREFIX="github.com--angrifel--unapologetic-${TAG}"
          echo "ASSET_PREFIX=${ASSET_PREFIX}" >> "$GITHUB_ENV"
          echo "RELEASE_NOTES=${ASSET_PREFIX}.release-notes.md" >> "$GITHUB_ENV"
          echo "ARCHIVE=${ASSET_PREFIX}.tar.gz" >> "$GITHUB_ENV"
          echo "ZIP_ARCHIVE=${ASSET_PREFIX}.zip" >> "$GITHUB_ENV"
          echo "SBOM=${ASSET_PREFIX}.sbom.spdx.json" >> "$GITHUB_ENV"
          echo "CHECKSUMS=${ASSET_PREFIX}.sha256sums.txt" >> "$GITHUB_ENV"

      - name: Extract changelog release notes
        run: ./release-management.sh extract-version-notes "$TAG" > "${RELEASE_NOTES}"

      - name: Create source archive (tar.gz)
        run: git archive --format=tar.gz --prefix=${ASSET_PREFIX}/ -o "$ARCHIVE" HEAD

      - name: Create source archive (zip)
        run: git archive --format=zip --prefix=${ASSET_PREFIX}/ -o "$ZIP_ARCHIVE" HEAD

      - name: Generate SBOM
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin v1.38.2
          syft . --output spdx-json="$SBOM"

      - name: Generate checksums
        run: sha256sum "$ARCHIVE" "$ZIP_ARCHIVE" "$SBOM" > "$CHECKSUMS"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+-.'; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "$TAG" --notes-file "$RELEASE_NOTES" $PRERELEASE_FLAG

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "$ARCHIVE" "$ZIP_ARCHIVE" "$SBOM" "$CHECKSUMS"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-checksums: ${{ env.CHECKSUMS }}

      - name: Attest SBOM
        uses: actions/attest-sbom@v3
        with:
          subject-path: |
            ${{ env.ARCHIVE }}
            ${{ env.ZIP_ARCHIVE }}
          sbom-path: ${{ env.SBOM }}
