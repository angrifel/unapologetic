name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

env:
  TAG: ${{ github.ref_name }}

jobs:
  draft-release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set archive name
        run: |
          echo "ARCHIVE=unapologetic-${TAG}.tar.gz" >> "$GITHUB_ENV"
          echo "SBOM=unapologetic-${TAG}.sbom.spdx.json" >> "$GITHUB_ENV"

      - name: Create source archive
        run: git archive --format=tar.gz --prefix=unapologetic-${TAG}/ -o "$ARCHIVE" HEAD

      - name: Generate SBOM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api repos/${{ github.repository }}/dependency-graph/sbom --jq '.sbom' > "$SBOM"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "$TAG" --generate-notes

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "$ARCHIVE" "$SBOM"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ env.ARCHIVE }}

      - name: Attest SBOM
        uses: actions/attest-sbom@v3
        with:
          subject-path: ${{ env.ARCHIVE }}
          sbom-path: ${{ env.SBOM }}
